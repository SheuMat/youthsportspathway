<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>YSP Admin</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body { background: var(--grey-lt); }
    .admin { max-width: 1200px; margin: 0 auto; padding: 32px 16px; }
    .admin h1 { font-size: 2rem; margin-bottom: 16px; }
    .admin h2 { font-size: 1.4rem; margin: 32px 0 12px; }
    .admin table { width: 100%; border-collapse: collapse; background: #fff; font-size: 0.85rem; }
    .admin th, .admin td { padding: 8px 10px; border-bottom: 1px solid #e8e8e8; text-align: left; vertical-align: top; }
    .admin th { background: var(--dark); color: #fff; font-family: var(--font-head); text-transform: uppercase; letter-spacing: 1px; font-size: 0.75rem; }
    .admin .wrap { overflow-x: auto; }
    .admin button { font: inherit; font-size: 0.8rem; padding: 4px 10px; margin: 2px; cursor: pointer; border: 1px solid var(--dark); background: #fff; border-radius: 3px; }
    .admin .banner { padding: 12px 16px; background: #fff; border-left: 4px solid var(--red); margin-bottom: 8px; font-size: 0.9rem; }
    .admin input, .admin select, .admin textarea { font: inherit; font-size: 0.9rem; padding: 8px; border: 1px solid #ccc; border-radius: 3px; max-width: 100%; background: #fff; }
    .admin textarea { width: 100%; min-height: 70px; }
    .admin label { display: block; font-weight: 600; font-size: 0.85rem; margin: 10px 0 4px; }
    .admin .card { background: #fff; border-radius: 6px; padding: 20px; margin-bottom: 16px; max-width: 560px; }
    .admin .card.wide { max-width: none; }
    .admin .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0 16px; }
    .admin .err { color: #a80015; font-weight: 600; margin-top: 8px; }
    .admin .ok { color: #166534; font-weight: 600; margin-top: 8px; }
    .admin .primary { background: var(--red) !important; color: #fff; border-color: var(--red) !important; padding: 8px 18px !important; font-size: 0.9rem !important; }
    .admin .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 20px; }
    .admin .tabs button[aria-pressed=true] { background: var(--dark); color: #fff; }
    .admin .top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .admin .hint { font-size: 0.8rem; color: #666; margin-top: 4px; }
    .admin .qr svg { width: 200px; height: 200px; }
    .admin code { background: #f0f0f0; padding: 2px 6px; border-radius: 3px; word-break: break-all; }
  </style>
</head>
<body>
  <main class="admin">
    <div class="top"><h1>YSP Admin</h1><div id="who"></div></div>
    <div id="out" aria-live="polite"></div>
  </main>
  <script src="js/site-data.js"></script>
  <script src="/api/settings.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
