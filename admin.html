<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>YSP Admin</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body { background: var(--grey-lt); }
    .admin { max-width: 1200px; margin: 0 auto; padding: 32px 16px; }
    .admin h1 { font-size: 2rem; margin-bottom: 16px; }
    .admin h2 { font-size: 1.4rem; margin: 32px 0 12px; }
    .admin table { width: 100%; border-collapse: collapse; background: #fff; font-size: 0.85rem; }
    .admin th, .admin td { padding: 8px 10px; border-bottom: 1px solid #e8e8e8; text-align: left; vertical-align: top; }
    .admin th { background: var(--dark); color: #fff; font-family: var(--font-head); text-transform: uppercase; letter-spacing: 1px; font-size: 0.75rem; }
    .admin .wrap { overflow-x: auto; }
    .admin button { font: inherit; font-size: 0.8rem; padding: 4px 10px; margin: 2px; cursor: pointer; border: 1px solid var(--dark); background: #fff; border-radius: 3px; }
    .admin .banner { padding: 12px 16px; background: #fff; border-left: 4px solid var(--red); margin-bottom: 8px; font-size: 0.9rem; }
    .admin input[type=password] { padding: 8px; border: 1px solid #ccc; width: 320px; max-width: 100%; }
  </style>
</head>
<body>
  <main class="admin">
    <h1>YSP Admin</h1>
    <form id="login"><label for="tok">Admin token</label><br /><input type="password" id="tok" autocomplete="off" /> <button type="submit">Load</button></form>
    <div id="out"></div>
  </main>
  <script src="js/site-data.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
